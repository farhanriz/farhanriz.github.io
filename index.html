<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <button id="theme-toggle" class="icon-btn" aria-label="Toggle theme">
                <svg id="sun-icon" class="icon hidden-dark" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                </svg>
                <svg id="moon-icon" class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                </svg>
            </button>
            <nav class="nav">
                <a href="#intro" class="nav-link">Intro</a>
                <a href="#projects" class="nav-link">Projects</a>
                <a href="#skills" class="nav-link">Skills</a>
                <a href="#experience" class="nav-link">Experience</a>
            </nav>
        </div>
    </header>

    <main class="main">
        <section id="intro" class="section intro-section">
            <div class="intro-content">
                <div class="profile-image-container">
                    <img id="profile-image" class="profile-image" src="https://picsum.photos/200/200?random=99" alt="Profile">
                </div>
                <h1 id="profile-name" class="name"></h1>
                <h2 id="profile-role" class="role"></h2>
                <div class="contact-links">
                    <a id="email-link" class="contact-btn" aria-label="Email">
                        <svg class="contact-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                        </svg>
                    </a>
                    <a id="github-link" target="_blank" class="contact-btn" aria-label="GitHub">
                        <svg class="contact-icon" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"></path>
                        </svg>
                    </a>
                    <a id="linkedin-link" target="_blank" class="contact-btn" aria-label="LinkedIn">
                        <svg class="contact-icon" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.925-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"></path>
                        </svg>
                    </a>
                    <a id="medium-link" target="_blank" class="contact-btn" aria-label="Medium" style="display: none;">
                        <svg class="contact-icon" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M13.54 12a6.8 6.8 0 01-6.77 6.82A6.8 6.8 0 010 12a6.8 6.8 0 016.77-6.82A6.8 6.8 0 0113.54 12zM20.96 12c0 3.54-1.51 6.42-3.38 6.42-1.87 0-3.39-2.88-3.39-6.42s1.52-6.42 3.39-6.42 3.38 2.88 3.38 6.42M24 12c0 3.17-.53 5.75-1.19 5.75-.66 0-1.19-2.58-1.19-5.75s.53-5.75 1.19-5.75C23.47 6.25 24 8.83 24 12z"></path>
                        </svg>
                    </a>
                </div>
                <p id="profile-intro" class="intro-text"></p>
            </div>
        </section>

        <section id="projects" class="section">
            <div class="container">
                <h2 class="section-title">Projects</h2>
                <div class="projects-filter">
                    <input type="text" id="project-search" class="search-input" placeholder="Search projects...">
                    <div id="selected-tags-display" class="selected-tags-display"></div>
                    <div class="filter-row">
                        <div id="task-dropdown" class="filter-dropdown"></div>
                        <div id="tools-dropdown" class="filter-dropdown"></div>
                        <div id="output-dropdown" class="filter-dropdown"></div>
                        <div id="year-dropdown" class="filter-dropdown"></div>
                        <button id="clear-filters" class="clear-filters-btn" style="display:none;">Clear All</button>
                    </div>
                </div>
                <div id="projects-container" class="projects-container">
                    <div id="projects-grid" class="projects-grid"></div>
                    <div id="project-detail" class="project-detail">
                        <div class="project-detail-placeholder">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
                            </svg>
                            <p>Select a project to view details</p>
                        </div>
                        <div id="project-detail-content" class="project-detail-content" style="display:none;">
                            <button class="project-detail-close" id="project-detail-close">&times;</button>
                            <img id="detail-image" class="detail-image" src="" alt="">
                            <div class="detail-body">
                                <div class="detail-year" id="detail-year"></div>
                                <h2 id="detail-title" class="detail-title"></h2>
                                <p id="detail-description" class="detail-description"></p>
                                <div id="detail-tags" class="detail-tags"></div>
                                <div id="detail-company" class="detail-company"></div>
                                <a id="detail-link" class="detail-link" href="#" target="_blank">View Project</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <div id="project-modal" class="modal-overlay">
            <div class="modal">
                <button class="modal-close" onclick="closeProjectModal()">&times;</button>
                <img id="modal-image" class="modal-image" src="" alt="">
                <div class="modal-body">
                    <h2 id="modal-title" class="modal-title"></h2>
                    <p id="modal-description" class="modal-description"></p>
                    <div id="modal-tags" class="modal-tags-section"></div>
                </div>
            </div>
        </div>

        <section id="skills" class="section section-alt">
            <div class="container">
                <h2 class="section-title">Skills</h2>
                <div class="skill-tabs">
                    <button class="skill-tab active" data-tab="task">Task</button>
                    <button class="skill-tab" data-tab="tools">Tools</button>
                    <button class="skill-tab" data-tab="soft">Soft Skills</button>
                </div>
                <div id="skills-content" class="skills-content"></div>
            </div>
        </section>

        <section id="experience" class="section">
            <div class="container">
                <h2 class="section-title">Work Experience</h2>
                <div id="experience-timeline" class="timeline"></div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <button id="footer-theme-toggle" class="icon-btn" aria-label="Toggle theme">
                <svg class="icon footer-icon-sun hidden-dark" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                </svg>
                <svg class="icon footer-icon-moon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                </svg>
            </button>
            <div class="footer-contact">
                <a id="footer-email" href="mailto:rizaldifarhan@gmail.com" class="footer-link">rizaldifarhan@gmail.com</a>
                <a id="footer-github" href="https://github.com/farhanriz" target="_blank" class="footer-link">GitHub</a>
                <a id="footer-linkedin" href="https://www.linkedin.com/in/farhanrizaldi/" target="_blank" class="footer-link">LinkedIn</a>
                <a id="footer-medium" href="https://medium.com/@rizaldifarhan" target="_blank" class="footer-link">Medium</a>
            </div>
            <nav class="nav">
                <a href="#intro" class="nav-link">Intro</a>
                <a href="#projects" class="nav-link">Projects</a>
                <a href="#skills" class="nav-link">Skills</a>
                <a href="#experience" class="nav-link">Experience</a>
            </nav>
        </div>
    </footer>

    <script src="assets/data/portfolio.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
